name: mlkit_camera_example
description: Third-party demo app for the mlkit_camera package (barcode, OCR, objects).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mlkit_camera:
    path: ../packages/mlkit_camera
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
