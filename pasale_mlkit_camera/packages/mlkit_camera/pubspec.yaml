name: mlkit_camera
description: >
  On-device camera vision package using Google ML Kit — barcode scanning,
  text recognition (OCR), and object detection. POS-agnostic Flutter API
  with continuous preview until explicit stop.
version: 0.1.0
homepage: https://github.com/pasale/mlkit_camera
repository: https://github.com/pasale/mlkit_camera
issue_tracker: https://github.com/pasale/mlkit_camera/issues
topics:
  - mlkit
  - camera
  - barcode
  - ocr
  - object-detection

environment:
  sdk: ^3.0.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  google_mlkit_commons: ^0.11.0
  google_mlkit_barcode_scanning: ^0.14.1
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_object_detection: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
