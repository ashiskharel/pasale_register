name: ci

on:
  push:
    paths:
      - 'pasale_mlkit_camera/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'pasale_mlkit_camera/**'

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pasale_mlkit_camera/packages/mlkit_camera
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart analyze --fatal-infos
      - run: flutter test
